<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="container">

    <h1 id="form-title">Account Registration Form</h1>
    <p class="subtitle">Please fill in your details accurately.</p>

    <form aria-labelledby="form-title">

      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input name="fullname" type="text" id="fullname" required>
        <small class="hint">Enter your full legal name</small>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input name="email" type="email" id="email" required>
        <small class="hint">We’ll use this for account communication</small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input name="password" type="password" id="password" required>
        <small class="hint">Must be at least 8 characters</small>
      </div>

      <div class="form-group">
        <label for="role">Select Role</label>
        <select id="role" name="role" required>
          <option value="" disabled selected>-- Choose a role --</option>
          <option value="student">Student</option>
          <option value="developer">Developer</option>
          <option value="tester">Tester</option>
        </select>
      </div>

      <div class="form-group checkbox">
        <input name="terms" type="checkbox" id="terms" required>
        <label for="terms">I agree to the terms and conditions</label>
      </div>

      <button type="submit">Submit</button>

    </form>

  </main>

</body>
</html>
